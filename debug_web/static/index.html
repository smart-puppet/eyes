<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>eyes debug web</title>
  <style>
    :root {
      --bg: #1a1f1c;
      --panel: #243028;
      --ink: #e8efe6;
      --muted: #8fa394;
      --accent: #3d8f5f;
      --stop: #c43c2c;
      --btn: #2f3b34;
      --btn-active: #3d8f5f;
      --border: #3a4a40;
      --warn: #c9a227;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 20% 0%, #2a3a30 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.25rem;
      user-select: none;
      -webkit-user-select: none;
    }
    h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 0.25rem;
    }
    .sub {
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0 0 1.25rem;
      text-align: center;
      max-width: 48rem;
    }
    .layout {
      display: grid;
      gap: 1rem;
      width: min(1400px, 100%);
    }
    .main {
      display: grid;
      gap: 1rem;
      grid-template-columns: 1fr;
    }
    @media (min-width: 900px) {
      .main {
        grid-template-columns: 1.4fr 0.9fr;
        align-items: start;
      }
    }
    .viewport {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 0.65rem;
      overflow: hidden;
      line-height: 0;
    }
    .viewport img {
      width: 100%;
      height: auto;
      border-radius: 0.55rem;
      background: #0d100e;
      min-height: 240px;
      object-fit: contain;
    }
    .controls {
      display: grid;
      gap: 0.75rem;
    }
    .row {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 0.35rem;
      background: #314038;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge.estop { color: #ff8a7a; background: #4a2a28; }
    .badge.err { color: #ff8a7a; background: #4a2a28; }
    .toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      overflow: hidden;
      background: var(--btn);
    }
    .toggle button {
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.65rem 0.9rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    .toggle button.active {
      background: var(--btn-active);
      color: #fff;
    }
    .pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 0.55rem;
      aspect-ratio: 1;
      max-width: 280px;
      width: 100%;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 0.7rem;
      touch-action: none;
    }
    .btn {
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      background: var(--btn);
      color: var(--ink);
      font-size: 1.6rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 80ms ease, transform 80ms ease;
    }
    .btn:active, .btn.active {
      background: var(--btn-active);
      transform: scale(0.97);
    }
    .up { grid-column: 2; grid-row: 1; }
    .left { grid-column: 1; grid-row: 2; }
    .right { grid-column: 3; grid-row: 2; }
    .down { grid-column: 2; grid-row: 3; }
    .center {
      grid-column: 2;
      grid-row: 2;
      background: transparent;
      border: none;
      pointer-events: none;
      font-size: 0.7rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stop {
      width: 100%;
      padding: 0.9rem;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: var(--stop);
      border: none;
      border-radius: 0.75rem;
      color: #fff;
      cursor: pointer;
    }
    .stop:active { filter: brightness(0.9); }
    .clear-btn {
      flex: 1;
      padding: 0.65rem;
      border-radius: 0.6rem;
      border: 1px solid var(--border);
      background: var(--btn);
      color: var(--ink);
      cursor: pointer;
      font-weight: 600;
    }
    .capture-btn {
      padding: 0.65rem 1.1rem;
      border-radius: 0.75rem;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      touch-action: manipulation;
    }
    .capture-btn:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    .capture-btn:active:not(:disabled) { filter: brightness(0.92); }
    label { font-size: 0.85rem; color: var(--muted); }
    input[type="range"] { flex: 1; min-width: 100px; }
    .val { min-width: 2.5rem; font-variant-numeric: tabular-nums; }
    .status {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.78rem;
      line-height: 1.45;
      color: var(--muted);
      min-height: 8rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .info-row {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: 1fr;
      align-items: stretch;
    }
    @media (min-width: 900px) {
      .info-row { grid-template-columns: 1fr 1fr; }
    }
    .log-pane {
      background: #141a16;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      overflow: auto;
      padding: 0.55rem 0.7rem 0.7rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.72rem;
      line-height: 1.4;
    }
    .log-drive {
      min-height: 8rem;
      max-height: 16rem;
    }
    .log-brain {
      min-height: 28rem;
      height: 55vh;
      max-height: 70vh;
      width: 100%;
    }
    .log-pane h2 {
      position: sticky;
      top: 0;
      margin: 0 0 0.45rem;
      padding: 0.15rem 0 0.35rem;
      background: #141a16;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      z-index: 1;
    }
    .log-line { color: var(--muted); word-break: break-word; }
    .log-line .t { color: #6d7f72; margin-right: 0.4rem; }
    .log-line.debug { color: #7a8c80; }
    .log-line.info { color: var(--ink); }
    .log-line.warning { color: var(--warn); }
    .log-line.error, .log-line.critical { color: #ff8a7a; }
    .log-empty { color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <h1>Eyes + drive</h1>
  <p class="sub">MJPEG camera · Capture runs YOLO/depth/traverse once · hold arrows to drive (WASD) · STOP flushes MCU · live brain/drive logs below</p>

  <div class="layout">
    <div class="row">
      <span id="modeBadge" class="badge">camera</span>
      <span id="holdBadge" class="badge">idle</span>
      <span id="estopBadge" class="badge estop" hidden>estop</span>
      <span id="errBadge" class="badge err" hidden>error</span>
      <div class="toggle" role="group" aria-label="View mode">
        <button type="button" id="btnCamera" class="active">Camera</button>
        <button type="button" id="btnOverlay">Boxes + distance</button>
        <button type="button" id="btnTraverse">Traversability</button>
      </div>
      <button type="button" class="capture-btn" id="captureBtn">Capture</button>
    </div>

    <div class="main">
      <div class="viewport">
        <img id="stream" src="/stream.mjpg" alt="Live MJPEG stream" />
      </div>

      <div class="controls">
        <div class="pad" id="pad">
          <button class="btn up" data-dir="forward" aria-label="Forward">▲</button>
          <button class="btn left" data-dir="left" aria-label="Left">◀</button>
          <div class="center">hold</div>
          <button class="btn right" data-dir="right" aria-label="Right">▶</button>
          <button class="btn down" data-dir="backward" aria-label="Backward">▼</button>
        </div>

        <button class="stop" id="stopBtn" type="button">Stop</button>
        <div class="row">
          <button class="clear-btn" id="clearBtn" type="button">Clear estop</button>
        </div>
        <div class="row">
          <label for="speed">Speed</label>
          <input id="speed" type="range" min="20" max="200" value="100" />
          <span class="val" id="speedVal">100</span>
        </div>
        <div class="row">
          <label for="ttl">Watchdog TTL (ms)</label>
          <input id="ttl" type="range" min="50" max="1000" step="50" value="300" />
          <span class="val" id="ttlVal">300</span>
        </div>
      </div>
    </div>

    <div class="info-row">
      <div class="status" id="status">Connecting…</div>
      <div class="log-pane log-drive" id="driveLog"><h2>Drive logs</h2><div class="log-empty">Waiting for robot/log/drive…</div></div>
    </div>
    <div class="log-pane log-brain" id="brainLog"><h2>Brain logs</h2><div class="log-empty">Waiting for robot/log/brain…</div></div>
  </div>

  <script>
    const modeBadge = document.getElementById("modeBadge");
    const holdBadge = document.getElementById("holdBadge");
    const estopBadge = document.getElementById("estopBadge");
    const errBadge = document.getElementById("errBadge");
    const statusEl = document.getElementById("status");
    const btnCamera = document.getElementById("btnCamera");
    const btnOverlay = document.getElementById("btnOverlay");
    const btnTraverse = document.getElementById("btnTraverse");
    const captureBtn = document.getElementById("captureBtn");
    const speedEl = document.getElementById("speed");
    const ttlEl = document.getElementById("ttl");
    const speedVal = document.getElementById("speedVal");
    const ttlVal = document.getElementById("ttlVal");

    speedEl.addEventListener("input", () => { speedVal.textContent = speedEl.value; });
    ttlEl.addEventListener("input", () => { ttlVal.textContent = ttlEl.value; });

    let activeDir = null;
    let capturing = false;
    let currentView = "camera";
    const keyMap = {
      ArrowUp: "forward", w: "forward", W: "forward",
      ArrowDown: "backward", s: "backward", S: "backward",
      ArrowLeft: "left", a: "left", A: "left",
      ArrowRight: "right", d: "right", D: "right",
    };

    async function post(path, body) {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : "{}",
      });
      if (!res.ok) {
        throw new Error((await res.text()) || res.statusText);
      }
      return res.json();
    }

    function syncCaptureBtn() {
      captureBtn.disabled = capturing || currentView === "camera";
      captureBtn.textContent = capturing ? "Capturing…" : "Capture";
    }

    async function setView(view) {
      currentView = view;
      btnCamera.classList.toggle("active", view === "camera");
      btnOverlay.classList.toggle("active", view === "boxes");
      btnTraverse.classList.toggle("active", view === "traverse");
      modeBadge.textContent = view;
      syncCaptureBtn();
      try {
        await post("/api/view", { view });
      } catch (e) {
        statusEl.textContent = "View error: " + e.message;
      }
    }
    btnCamera.addEventListener("click", () => setView("camera"));
    btnOverlay.addEventListener("click", () => setView("boxes"));
    btnTraverse.addEventListener("click", () => setView("traverse"));

    async function triggerCapture() {
      if (capturing || currentView === "camera") return;
      capturing = true;
      syncCaptureBtn();
      try {
        const data = await post("/api/capture");
        statusEl.textContent = [
          "capture ok  view: " + (data.view || currentView),
          "infer: " + (data.infer_ms ?? "—") + " ms  dets: " + (data.dets ?? "—"),
          "closest: " + (data.closest_m ?? "—") + " m  hint: " + (data.hint || "—"),
        ].join("\n");
        await poll();
      } catch (e) {
        statusEl.textContent = "Capture error: " + e.message;
      } finally {
        capturing = false;
        syncCaptureBtn();
      }
    }
    captureBtn.addEventListener("click", (e) => {
      e.preventDefault();
      triggerCapture();
    });
    syncCaptureBtn();
    async function hold(dir) {
      if (activeDir === dir) return;
      activeDir = dir;
      document.querySelectorAll(".btn[data-dir]").forEach((b) => {
        b.classList.toggle("active", b.dataset.dir === dir);
      });
      holdBadge.textContent = dir;
      try {
        await post("/api/hold", {
          direction: dir,
          speed: Number(speedEl.value),
          ttl_ms: Number(ttlEl.value),
        });
      } catch (e) {
        statusEl.textContent = "Hold error: " + e.message;
      }
    }

    async function release() {
      if (!activeDir) return;
      activeDir = null;
      document.querySelectorAll(".btn[data-dir]").forEach((b) => b.classList.remove("active"));
      holdBadge.textContent = "idle";
      try {
        await post("/api/release");
      } catch (e) {
        statusEl.textContent = "Release error: " + e.message;
      }
    }

    async function stopAll() {
      activeDir = null;
      document.querySelectorAll(".btn[data-dir]").forEach((b) => b.classList.remove("active"));
      holdBadge.textContent = "idle";
      try {
        await post("/api/stop");
      } catch (e) {
        statusEl.textContent = "Stop error: " + e.message;
      }
    }

    function bindPadButton(btn) {
      const dir = btn.dataset.dir;
      const start = (ev) => { ev.preventDefault(); hold(dir); };
      const end = (ev) => { ev.preventDefault(); release(); };
      btn.addEventListener("pointerdown", start);
      btn.addEventListener("pointerup", end);
      btn.addEventListener("pointercancel", end);
      btn.addEventListener("pointerleave", (ev) => {
        if (activeDir === dir) end(ev);
      });
    }
    document.querySelectorAll(".btn[data-dir]").forEach(bindPadButton);
    document.getElementById("stopBtn").addEventListener("click", (e) => {
      e.preventDefault();
      stopAll();
    });
    document.getElementById("clearBtn").addEventListener("click", async (e) => {
      e.preventDefault();
      try { await post("/api/clear"); } catch (err) {
        statusEl.textContent = "Clear error: " + err.message;
      }
    });

    window.addEventListener("keydown", (ev) => {
      if (ev.repeat) return;
      if (ev.key === " " || ev.key === "Escape") {
        ev.preventDefault();
        stopAll();
        return;
      }
      if (ev.key === "c" || ev.key === "C") {
        if (!ev.metaKey && !ev.ctrlKey && !ev.altKey) {
          ev.preventDefault();
          triggerCapture();
        }
        return;
      }
      const dir = keyMap[ev.key];
      if (dir) {
        ev.preventDefault();
        hold(dir);
      }
    });    window.addEventListener("keyup", (ev) => {
      const dir = keyMap[ev.key];
      if (dir && activeDir === dir) {
        ev.preventDefault();
        release();
      }
    });
    window.addEventListener("blur", () => { release(); });

    function renderState(data) {
      const view = data.view || (data.overlay ? "boxes" : "camera");
      currentView = view;
      btnCamera.classList.toggle("active", view === "camera");
      btnOverlay.classList.toggle("active", view === "boxes");
      btnTraverse.classList.toggle("active", view === "traverse");
      modeBadge.textContent = view;
      syncCaptureBtn();

      const drive = data.drive || {};
      const st = drive.status || {};
      const estop = !!st.estop;
      estopBadge.hidden = !estop;
      if (!activeDir) {
        holdBadge.textContent = drive.holding || "idle";
      }

      const errs = [];
      if (data.error) errs.push(data.error);
      if (drive.mqtt_error) errs.push(drive.mqtt_error);
      if (data.mqtt_error) errs.push(data.mqtt_error);
      if (errs.length) {
        errBadge.hidden = false;
        errBadge.textContent = "error";
      } else {
        errBadge.hidden = true;
      }

      const sec = (data.scene && data.scene.sectors) || {};
      const lines = [
        "view: " + view + "  mode: manual capture",
        "fps: " + (data.fps ?? "—") + "  infer: " + (data.infer_ms ?? "—") + " ms",
        "dets: " + (data.dets ?? "—") + "  closest: " + (data.closest_m ?? "—") + " m",
        "hint: " + (data.hint || "—"),
        "sectors L/C/R: " + (sec.left ?? "—") + " / " + (sec.center ?? "—") + " / " + (sec.right ?? "—"),
        "scene mqtt: " + (data.mqtt_ok ? "ok " + (data.topic || "") : "down"),
        "device: " + (data.device ?? "—"),
        "",
        "drive holding: " + (drive.holding || "—"),
        "mqtt: " + (drive.mqtt_ok ? "ok" : "down") + "  prefix: " + (drive.prefix || "—"),
        "mode: " + (st.mode ?? "—") + "  estop: " + (estop ? "YES" : "no"),
        "error: " + (errs.join("; ") || "—"),
      ];
      if (!capturing) {
        statusEl.textContent = lines.join("\n");
      }
    }

    async function poll() {
      try {
        const res = await fetch("/api/state");
        renderState(await res.json());
      } catch (e) {
        statusEl.textContent = "Status poll failed: " + e.message;
      }
    }
    poll();
    setInterval(poll, 250);

    const brainLogEl = document.getElementById("brainLog");
    const driveLogEl = document.getElementById("driveLog");
    let logAfter = 0;
    const LOG_KEEP = { brain: 5000, drive: 500 };

    function fmtTs(ts) {
      const d = new Date((Number(ts) || 0) * 1000);
      if (Number.isNaN(d.getTime()) || d.getFullYear() < 2000) return "—";
      return d.toLocaleTimeString("en-GB", { hour12: false }) + "." +
        String(d.getMilliseconds()).padStart(3, "0");
    }

    function shortLogger(name) {
      const parts = String(name || "").split(".");
      return parts[parts.length - 1] || name || "";
    }

    function makeLogLine(r) {
      const div = document.createElement("div");
      const lvl = String(r.level || "INFO").toLowerCase();
      div.className = "log-line " + lvl;
      const t = document.createElement("span");
      t.className = "t";
      t.textContent = fmtTs(r.ts);
      div.appendChild(t);
      div.appendChild(document.createTextNode(
        lvl.toUpperCase() + " " + shortLogger(r.logger) + ": " + String(r.msg || "")
      ));
      return div;
    }

    function appendLogLines(el, rows, keep) {
      if (!rows.length) return;
      const stick = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
      const empty = el.querySelector(".log-empty");
      if (empty) empty.remove();
      const frag = document.createDocumentFragment();
      for (const r of rows) frag.appendChild(makeLogLine(r));
      el.appendChild(frag);
      const lines = el.querySelectorAll(".log-line");
      const extra = lines.length - keep;
      if (extra > 0) {
        for (let i = 0; i < extra; i++) lines[i].remove();
      }
      if (stick) el.scrollTop = el.scrollHeight;
    }

    async function pollLogs() {
      try {
        const res = await fetch("/api/logs?after=" + logAfter);
        const data = await res.json();
        appendLogLines(brainLogEl, data.brain || [], LOG_KEEP.brain);
        appendLogLines(driveLogEl, data.drive || [], LOG_KEEP.drive);
        if (typeof data.seq === "number") logAfter = data.seq;
      } catch (_) { /* keep last pane */ }
    }
    pollLogs();
    setInterval(pollLogs, 400);
  </script>
</body>
</html>
